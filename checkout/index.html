(function () {
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function parsePrice(str) {
    var m = /^([\d.]+)\s*([A-Za-z]{3})$/.exec(String(str || '').trim());
    if (!m) return { amount: 0, currency: 'USD' };
    return { amount: parseFloat(m[1]), currency: m[2].toUpperCase() };
  }
  function fmt(amount, currency) { return amount.toFixed(2) + ' ' + currency; }

  var app = document.getElementById('app');
  var qs = new URLSearchParams(window.location.search);
  var productsParam = qs.get('products');
  var coupon = qs.get('coupon');

  if (!productsParam) { window.location.replace(SHOP_HOME); return; }

  var items = [];
  productsParam.split(',').forEach(function (pair) {
    var parts = pair.split(':');
    var id = (parts[0] || '').trim();
    var qty = parseInt(parts[1], 10);
    if (!qty || qty < 1) qty = 1;
    if (PRODUCTS[id]) {
      var priceInfo = parsePrice(PRODUCTS[id].p);
      items.push({ id: id, qty: qty, info: PRODUCTS[id], unit: priceInfo.amount, currency: priceInfo.currency, line: priceInfo.amount * qty });
    }
  });

  if (items.length === 0) { window.location.replace(SHOP_HOME); return; }

  var currency = items[0].currency;
  var subtotal = 0;
  items.forEach(function (it) { subtotal += it.line; });

  });
